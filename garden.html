<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#160f1b">
  <meta name="description" content="Một khu vườn nhỏ rực rỡ và ấm áp dành riêng cho ngày sinh nhật của cậu.">

  <title>Our Little Garden 🌹 · Happy Birthday</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="garden-page">
  <!-- Immersive Fullscreen Garden Canvas -->
  <canvas id="garden-canvas" aria-label="Khu vườn hoa hồng rực rỡ dưới bầu trời đêm"></canvas>

  <!-- Floating Wish Bubble (Bay lên từ bông hoa khi chạm, không che giữa màn hình) -->
  <div class="floating-wish-bubble" id="floating-wish" role="status" aria-live="polite" hidden>
    <button class="wish-bubble-close" id="close-wish" type="button" aria-label="Đóng lời nhắn">×</button>
    <p class="wish-bubble-badge" id="wish-badge"></p>
    <p class="wish-bubble-text" id="wish-text"></p>
    <p class="wish-bubble-sub">Chạm vào bông hoa khác để nhận thêm điều ước ♡</p>
  </div>

  <!-- Transparent Floating UI Overlay -->
  <div class="garden-overlay">
    <header class="garden-header">
      <a class="garden-back-link" href="index.html">
        <span aria-hidden="true">←</span>
        Trang đầu
      </a>

      <div class="garden-header-actions">
        <button
          class="garden-action-btn"
          id="replay-bloom"
          type="button"
          title="Xem lại hiệu ứng hoa nở từ từ"
        >
          🌸 Cho hoa nở lại
        </button>
        <button
          class="garden-action-btn"
          id="fireflies-toggle"
          type="button"
          title="Thả thêm đom đóm phép thuật"
        >
          ✨ Thêm đom đóm
        </button>
        <button
          class="garden-sound-button"
          id="sound-toggle"
          type="button"
          aria-pressed="false"
        >
          ♫ Nhạc nền
        </button>
      </div>
    </header>

    <section class="garden-floating-intro">
      <p class="garden-eyebrow">A MAGICAL BIRTHDAY GARDEN FOR YOU</p>
      <h1>Our Little Garden <span>♡</span></h1>
      <p class="garden-hint">✧ Chạm vào từng đóa hoa để điều ước bay lên nhé ✧</p>
    </section>

    <div class="garden-bottom-actions">
      <a class="garden-next-cake-btn" href="cake.html">
        🎂 Đến chiếc bánh sinh nhật ♡
      </a>
    </div>
  </div>

  <script src="js/garden-botany.js"></script>
  <script src="js/garden.js"></script>
  <script src="js/seamless.js"></script>
</body>
</html>
