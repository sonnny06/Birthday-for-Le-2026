<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a122e">
  <meta name="description" content="Một cuốn sách cổ tích mở ra khu vườn hoa giấy 3D rực rỡ và ấm áp dành riêng cho ngày sinh nhật của V.SON.">

  <title>Our Little Garden 🌹 · Happy Birthday V.SON</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="garden-page">
  <!-- Global Reusable SVG Filters for 3D Papercut Depth & Fairy Glows -->
  <svg class="paper-filters" aria-hidden="true" style="position: absolute; width: 0; height: 0; pointer-events: none;">
    <defs>
      <filter id="paper-cut-shadow" x="-15%" y="-15%" width="130%" height="130%">
        <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#0a0514" flood-opacity="0.65" />
      </filter>
      <filter id="paper-glow-filter" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
  </svg>

  <div class="shadowbox-vignette"></div>

  <!-- 3D Layered Paper-Cut Canopy Frame, Wisteria Blossoms & Hanging Lanterns -->
  <div class="shadowbox-portal-frame" aria-hidden="true" style="z-index: 3; pointer-events: none;">
    <svg class="portal-svg-layer" viewBox="0 0 1440 900" preserveAspectRatio="none">
      <!-- Side Tree Trunks Framing Left & Right -->
      <path d="M0,0 L95,0 C70,180 42,360 58,580 C68,710 35,820 0,900 Z" fill="#1e112e" opacity="0.88" filter="url(#paper-cut-shadow)" />
      <path d="M1440,0 L1345,0 C1370,180 1398,360 1382,580 C1372,710 1405,820 1440,900 Z" fill="#1e112e" opacity="0.88" filter="url(#paper-cut-shadow)" />

      <!-- Upper Left Paper Canopy Boughs -->
      <path d="M-30,0 L390,0 C340,115 240,185 110,235 C45,260 -10,295 -30,320 Z" fill="#2d1c44" opacity="0.94" filter="url(#paper-cut-shadow)" />
      <path d="M-20,0 L270,0 C230,85 150,140 55,175 Z" fill="#3d234a" opacity="0.9" />
      <path d="M-10,0 L175,0 C145,55 95,95 25,120 Z" fill="#52325c" opacity="0.85" />

      <!-- Upper Right Paper Canopy Boughs -->
      <path d="M1470,0 L1050,0 C1100,115 1200,185 1330,235 C1395,260 1450,295 1470,320 Z" fill="#2d1c44" opacity="0.94" filter="url(#paper-cut-shadow)" />
      <path d="M1460,0 L1170,0 C1210,85 1290,140 1385,175 Z" fill="#3d234a" opacity="0.9" />
      <path d="M1450,0 L1265,0 C1295,55 1345,95 1415,120 Z" fill="#52325c" opacity="0.85" />

      <!-- Hanging Paper Wisteria / Blossom Garlands (Left) -->
      <g filter="url(#paper-cut-shadow)" opacity="0.92">
        <path d="M95,120 Q102,185 94,255" stroke="#6d4275" stroke-width="2" fill="none" />
        <circle cx="95" cy="145" r="9" fill="#dca2ae" />
        <circle cx="101" cy="164" r="8" fill="#f2c7ce" />
        <circle cx="92" cy="184" r="7.5" fill="#dca2ae" />
        <circle cx="98" cy="204" r="6.5" fill="#f2c7ce" />
        <circle cx="94" cy="224" r="5.5" fill="#ffd875" />
        <circle cx="95" cy="242" r="4" fill="#fff4b8" />

        <path d="M215,90 Q222,150 214,205" stroke="#6d4275" stroke-width="2" fill="none" />
        <circle cx="215" cy="112" r="8" fill="#f2c7ce" />
        <circle cx="220" cy="130" r="7" fill="#dca2ae" />
        <circle cx="213" cy="148" r="6.5" fill="#f2c7ce" />
        <circle cx="217" cy="166" r="5.5" fill="#dca2ae" />
        <circle cx="215" cy="184" r="4" fill="#ffd875" />
      </g>

      <!-- Hanging Paper Wisteria / Blossom Garlands (Right) -->
      <g filter="url(#paper-cut-shadow)" opacity="0.92">
        <path d="M1345,120 Q1338,185 1346,255" stroke="#6d4275" stroke-width="2" fill="none" />
        <circle cx="1345" cy="145" r="9" fill="#dca2ae" />
        <circle cx="1339" cy="164" r="8" fill="#f2c7ce" />
        <circle cx="1348" cy="184" r="7.5" fill="#dca2ae" />
        <circle cx="1342" cy="204" r="6.5" fill="#f2c7ce" />
        <circle cx="1346" cy="224" r="5.5" fill="#ffd875" />
        <circle cx="1345" cy="242" r="4" fill="#fff4b8" />

        <path d="M1225,90 Q1218,150 1226,205" stroke="#6d4275" stroke-width="2" fill="none" />
        <circle cx="1225" cy="112" r="8" fill="#f2c7ce" />
        <circle cx="1220" cy="130" r="7" fill="#dca2ae" />
        <circle cx="1227" cy="148" r="6.5" fill="#f2c7ce" />
        <circle cx="1223" cy="166" r="5.5" fill="#dca2ae" />
        <circle cx="1225" cy="184" r="4" fill="#ffd875" />
      </g>

      <!-- Fairy String Lights Draped Across Top Corners -->
      <path d="M0,190 Q190,240 360,0" fill="none" stroke="rgba(255, 216, 117, 0.45)" stroke-width="1.3" stroke-dasharray="3 3" />
      <circle cx="85" cy="198" r="4" fill="#fff4b8" filter="url(#paper-glow-filter)" />
      <circle cx="165" cy="184" r="4.5" fill="#ffd875" filter="url(#paper-glow-filter)" />
      <circle cx="240" cy="145" r="4" fill="#fff4b8" filter="url(#paper-glow-filter)" />
      <circle cx="305" cy="82" r="3.5" fill="#ffd875" filter="url(#paper-glow-filter)" />

      <path d="M1440,190 Q1250,240 1080,0" fill="none" stroke="rgba(255, 216, 117, 0.45)" stroke-width="1.3" stroke-dasharray="3 3" />
      <circle cx="1355" cy="198" r="4" fill="#fff4b8" filter="url(#paper-glow-filter)" />
      <circle cx="1275" cy="184" r="4.5" fill="#ffd875" filter="url(#paper-glow-filter)" />
      <circle cx="1200" cy="145" r="4" fill="#fff4b8" filter="url(#paper-glow-filter)" />
      <circle cx="1135" cy="82" r="3.5" fill="#ffd875" filter="url(#paper-glow-filter)" />

      <!-- Hanging Paper Lanterns (Nested inside translated <g> so CSS rotation never resets position!) -->
      <g transform="translate(155, 130)">
        <g class="paper-lantern">
          <line x1="0" y1="-130" x2="0" y2="0" stroke="rgba(255, 216, 117, 0.6)" stroke-dasharray="3 3" stroke-width="1.5" />
          <path d="M-13,0 L13,0 L17,30 L-17,30 Z" fill="#26132f" stroke="#ffd875" stroke-width="1.4" />
          <circle cx="0" cy="15" r="8.5" fill="#ffd875" class="lantern-glow-bulb" />
          <circle cx="0" cy="15" r="24" fill="rgba(255, 216, 117, 0.35)" filter="url(#paper-glow-filter)" />
          <polygon points="0,30 -5,44 5,44" fill="#dca2ae" />
        </g>
      </g>

      <g transform="translate(295, 78)">
        <g class="paper-lantern delay-2">
          <line x1="0" y1="-78" x2="0" y2="0" stroke="rgba(255, 216, 117, 0.5)" stroke-dasharray="3 3" stroke-width="1.3" />
          <path d="M-10,0 L10,0 L13,22 L-13,22 Z" fill="#26132f" stroke="#ffd875" stroke-width="1.2" />
          <circle cx="0" cy="11" r="6.5" fill="#fff4b8" class="lantern-glow-bulb" />
          <circle cx="0" cy="11" r="18" fill="rgba(255, 216, 117, 0.3)" filter="url(#paper-glow-filter)" />
          <polygon points="0,22 -4,32 4,32" fill="#f2c7ce" />
        </g>
      </g>

      <g transform="translate(1285, 130)">
        <g class="paper-lantern delay-1">
          <line x1="0" y1="-130" x2="0" y2="0" stroke="rgba(255, 216, 117, 0.6)" stroke-dasharray="3 3" stroke-width="1.5" />
          <path d="M-13,0 L13,0 L17,30 L-17,30 Z" fill="#26132f" stroke="#ffd875" stroke-width="1.4" />
          <circle cx="0" cy="15" r="8.5" fill="#ffd875" class="lantern-glow-bulb" />
          <circle cx="0" cy="15" r="24" fill="rgba(255, 216, 117, 0.35)" filter="url(#paper-glow-filter)" />
          <polygon points="0,30 -5,44 5,44" fill="#dca2ae" />
        </g>
      </g>

      <g transform="translate(1145, 78)">
        <g class="paper-lantern">
          <line x1="0" y1="-78" x2="0" y2="0" stroke="rgba(255, 216, 117, 0.5)" stroke-dasharray="3 3" stroke-width="1.3" />
          <path d="M-10,0 L10,0 L13,22 L-13,22 Z" fill="#26132f" stroke="#ffd875" stroke-width="1.2" />
          <circle cx="0" cy="11" r="6.5" fill="#fff4b8" class="lantern-glow-bulb" />
          <circle cx="0" cy="11" r="18" fill="rgba(255, 216, 117, 0.3)" filter="url(#paper-glow-filter)" />
          <polygon points="0,22 -4,32 4,32" fill="#f2c7ce" />
        </g>
      </g>
    </svg>
  </div>

  <!-- 3D Pop-Up Storybook Vintage Book Corner Flourishes -->
  <div class="storybook-book-frame" aria-hidden="true">
    <div class="storybook-corner top-left"></div>
    <div class="storybook-corner top-right"></div>
    <div class="storybook-corner bottom-left"></div>
    <div class="storybook-corner bottom-right"></div>
  </div>

  <!-- Immersive Fullscreen Garden Canvas (Pop-Up Paper Terrain & Botanicals) -->
  <canvas id="garden-canvas" aria-label="Bản đồ câu chuyện cổ tích 3D và khu vườn hoa hồng lung linh dưới bầu trời đêm"></canvas>

  <!-- Floating Wish Card (Vintage Parchment Note bay lên từ đóa hoa) -->
  <div class="floating-wish-bubble" id="floating-wish" role="status" aria-live="polite" hidden>
    <button class="wish-bubble-close" id="close-wish" type="button" aria-label="Đóng lời nhắn">×</button>
    <div class="wish-wax-seal" aria-hidden="true">♡</div>
    <div class="wish-bubble-badge" id="wish-badge"></div>
    <p class="wish-bubble-text" id="wish-text"></p>
    <p class="wish-bubble-sub">Chạm vào những đóa hoa khác để thu thập trọn bộ lời chúc nhé ♡</p>
  </div>

  <!-- Transparent Floating UI Overlay -->
  <div class="garden-overlay">
    <div class="garden-top-group">
      <header class="garden-header">
        <a class="garden-back-link" href="index.html" style="pointer-events: auto;">
          <span aria-hidden="true">←</span>
          Cổng Cổ Tích
        </a>

        <div class="garden-header-actions">
          <span class="wish-counter-pill" id="wish-counter-badge" title="Số lời chúc sinh nhật cậu đã khám phá">
            🌷 Đã mở: 0 / 12
          </span>
          <button
            class="garden-action-btn"
            id="replay-bloom"
            type="button"
            title="Xem lại hiệu ứng hoa giấy nở từ từ"
          >
            🌸 Nở hoa lại
          </button>
          <button
            class="garden-action-btn"
            id="fireflies-toggle"
            type="button"
            title="Thả thêm đom đóm & đèn trời phép thuật"
          >
            ✨ Thả đom đóm
          </button>
          <button
            class="garden-sound-button"
            id="sound-toggle"
            type="button"
            aria-pressed="false"
          >
            ♫ Nhạc nền
          </button>
        </div>
      </header>

      <!-- Positioned gracefully in the upper sky so it never overlaps the flowers -->
      <section class="garden-floating-intro">
        <div class="garden-title-cartouche">
          <p class="garden-eyebrow">✧ CHƯƠNG II · A 3D POP-UP STORYBOOK GARDEN ✧</p>
          <h1>Khu Vườn Của <span>V.SON ♡</span></h1>
          <div class="garden-title-divider" aria-hidden="true">
            <span></span>
            <i>✦</i>
            <span></span>
          </div>
          <p class="garden-hint">✧ Chạm vào từng đóa hoa hồng để lời chúc bay lên nhé ✧</p>
        </div>
      </section>
    </div>

    <div class="garden-bottom-actions">
      <a class="garden-next-cake-btn" href="cake.html">
        <span>🎂 Đến Bàn Tiệc Bánh Sinh Nhật</span>
        <span aria-hidden="true">→</span>
      </a>
    </div>
  </div>

  <script src="js/garden-botany.js"></script>
  <script src="js/garden.js"></script>
  <script src="js/seamless.js"></script>
</body>
</html>
