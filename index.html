    .lantern-glow-mesh {
      box-shadow: 0 0 24px 8px rgba(255, 216, 117, 0.65), 0 0 55px 18px rgba(255, 170, 66, 0.3);
      transition: box-shadow 0.4s ease, transform 0.4s ease;

      transform: translateY(-3px) scale(1.04);

    .btn-explore-glow:active {

       ============================================================ -->
  <script>
    (() => {
      'use strict';

      /* DOM Elements */
      const layer1 = document.getElementById('layer-1');
      const layer2 = document.getElementById('layer-2');
      const layer3 = document.getElementById('layer-3');
      const roseGlow = document.getElementById('rose-glow');
      const btnExplore = document.getElementById('btn-explore');
      const flashOverlay = document.getElementById('flash-overlay');
      const firefliesCanvas = document.getElementById('fireflies-canvas');

      /* Mouse Tracking State */
      const mouse = {
        x: window.innerWidth / 2,
        y: window.innerHeight / 2,
        normX: 0,
        normY: 0,
        isActive: false
      };

      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.normX = (e.clientX / window.innerWidth - 0.5) * 2; // -1 to 1
        mouse.normY = (e.clientY / window.innerHeight - 0.5) * 2; // -1 to 1
        mouse.isActive = true;

        /* -------------------------------------------------------------
         * 1. MOUSE PARALLAX (GSAP): 
         * Layer 3 moves slightly opposite, Layer 2 moderately, Layer 1 stays mostly still
         * ------------------------------------------------------------*/
        // Layer 3 (Foreground Archway): Moves OPPOSITE to the mouse
        gsap.to(layer3, {
          x: -mouse.normX * 28,
          y: -mouse.normY * 18,
          rotationX: mouse.normY * 2.5,
          rotationY: -mouse.normX * 2.5,
          duration: 1.1,
          ease: "power2.out"
        });

        // Layer 2 (Mid-ground Vines & Lanterns): Moves MODERATELY
        gsap.to(layer2, {
          x: mouse.normX * 18,
          y: mouse.normY * 12,
          rotationX: -mouse.normY * 1.8,
          rotationY: mouse.normX * 1.8,
          duration: 1.0,
          ease: "power2.out"
        });

        // Layer 1 (Background Starry Sky & Centerpiece): Stays MOSTLY STILL
        gsap.to(layer1, {
          x: mouse.normX * 6,
          y: mouse.normY * 4,
          duration: 1.3,
          ease: "power2.out"
        });
      });

      /* -------------------------------------------------------------
       * 2. PULSING CENTER: HEARTBEAT ANIMATION ON ROSE RADIAL GLOW
       * ------------------------------------------------------------*/
      if (roseGlow) {
        const heartbeatTL = gsap.timeline({ repeat: -1, delay: 0.1 });
        heartbeatTL
          // Lub (first heartbeat)
          .to(roseGlow, { scale: 1.18, opacity: 0.95, duration: 0.22, ease: "power2.out" })
          .to(roseGlow, { scale: 1.04, opacity: 0.72, duration: 0.16, ease: "power1.in" })
          // Dub (second heartbeat, slightly stronger)
          .to(roseGlow, { scale: 1.25, opacity: 1.0, duration: 0.26, ease: "power2.out" })
          .to(roseGlow, { scale: 1.0, opacity: 0.65, duration: 0.65, ease: "sine.inOut" })
          // Rest pause before next beat
          .to({}, { duration: 0.85 });
      }

      /* -------------------------------------------------------------
       * 3. HOVER PHYSICS ON 4 SWINGING PAPER LANTERNS
       * ------------------------------------------------------------*/
      const lanterns = [
        { id: 'lantern-1', baseAmp: 3.5, baseDur: 2.4, isEven: true },
        { id: 'lantern-2', baseAmp: -3.0, baseDur: 2.1, isEven: false },
        { id: 'lantern-3', baseAmp: 3.0, baseDur: 2.2, isEven: true },
        { id: 'lantern-4', baseAmp: -3.5, baseDur: 2.5, isEven: false }
      ];

      lanterns.forEach(cfg => {
        const el = document.getElementById(cfg.id);
        if (!el) return;

        const glowMesh = el.querySelector('.lantern-glow-mesh');

        // Initial Ambient Gentle Swing
        let currentSwing = gsap.to(el, {
          rotation: cfg.baseAmp,
          duration: cfg.baseDur,
          repeat: -1,
          yoyo: true,
          ease: "sine.inOut",
          transformOrigin: "top center"
        });

        // Hover Physics: Swings faster and glow intensifies
        el.addEventListener('mouseenter', () => {
          currentSwing.kill();
          currentSwing = gsap.to(el, {
            rotation: cfg.isEven ? 9.5 : -9.5,
            duration: 0.55,
            repeat: -1,
            yoyo: true,
            ease: "power1.inOut",
            transformOrigin: "top center"
          });

          if (glowMesh) {
            gsap.to(glowMesh, {
              scale: 1.5,
              opacity: 1,
              duration: 0.35,
              ease: "power2.out"
            });
          }
        });

        // Mouse Leave: Smoothly dampens back to gentle ambient swing
        el.addEventListener('mouseleave', () => {
          currentSwing.kill();
          currentSwing = gsap.to(el, {
            rotation: cfg.baseAmp,
            duration: cfg.baseDur,
            repeat: -1,
            yoyo: true,
            ease: "sine.inOut",
            transformOrigin: "top center"
          });

          if (glowMesh) {
            gsap.to(glowMesh, {
              scale: 1,
              opacity: 0.85,
              duration: 0.6,
              ease: "power2.out"
            });
          }
        });
      });

      /* -------------------------------------------------------------
       * 4. INTERACTIVE FIREFLIES CANVAS (30% Gravitate towards Mouse)
       * ------------------------------------------------------------*/
      let animId = null;

      if (firefliesCanvas) {
        const fCtx = firefliesCanvas.getContext('2d');
        let width = 0, height = 0;

        function resizeCanvas() {
          width = firefliesCanvas.width = window.innerWidth;
          height = firefliesCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const fireflyCount = 55;
        const fireflies = [];

        // 30% of fireflies gravitate towards user's cursor
        const gravitatingCount = Math.floor(fireflyCount * 0.30);

        for (let i = 0; i < fireflyCount; i++) {
          const isGravitating = i < gravitatingCount;
          fireflies.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.9,
            vy: (Math.random() - 0.5) * 0.9,
            r: isGravitating ? (1.8 + Math.random() * 2.2) : (1.2 + Math.random() * 1.8),
            pulsePhase: Math.random() * Math.PI * 2,
            pulseSpeed: 1.8 + Math.random() * 2.4,
            isGravitating: isGravitating,
            orbitAngle: Math.random() * Math.PI * 2
          });
        }

        // Background twinkling stars
        const stars = Array.from({ length: 48 }, () => ({
          x: Math.random(),
          y: Math.random(),
          r: 0.8 + Math.random() * 1.6,
          speed: 1.0 + Math.random() * 2.2,
          phase: Math.random() * Math.PI * 2
        }));

        let lastT = performance.now();

        function renderFireflies(now) {
          const delta = Math.min((now - lastT) / 1000, 0.05);
          lastT = now;
          const time = now / 1000;

          fCtx.clearRect(0, 0, width, height);

          // 1. Twinkling Night Stars
          stars.forEach(s => {
            const alpha = 0.25 + 0.75 * Math.pow(Math.sin(time * s.speed + s.phase), 2);
            fCtx.fillStyle = `rgba(255, 244, 210, ${alpha})`;
            fCtx.beginPath();
            fCtx.arc(s.x * width, s.y * height, s.r, 0, Math.PI * 2);
            fCtx.fill();
          });

          // 2. Fireflies (Normal + Gravitating)
          fireflies.forEach(f => {
            if (f.isGravitating && mouse.isActive) {
              // Gravitate gently towards user's cursor
              const dx = mouse.x - f.x;
              const dy = mouse.y - f.y;
              const dist = Math.hypot(dx, dy);

              if (dist > 30) {
                // Attractive force towards mouse
                f.vx += (dx / dist) * 0.14;
                f.vy += (dy / dist) * 0.14;

                // Gentle playful swirl around cursor
                f.vx += (-dy / dist) * 0.08;
                f.vy += (dx / dist) * 0.08;
              }

              // Dampen velocity to prevent erratic oscillation
              f.vx *= 0.94;
              f.vy *= 0.94;

              // Cap speed
              const spd = Math.hypot(f.vx, f.vy);
              if (spd > 3.2) {
                f.vx = (f.vx / spd) * 3.2;
                f.vy = (f.vy / spd) * 3.2;
              }

              f.x += f.vx;
              f.y += f.vy;
            } else {
              // Free roaming ambient firefly
              f.x += f.vx * delta * 60;
              f.y += f.vy * delta * 60;

              // Wrap around screen boundaries
              if (f.x < -20) f.x = width + 20;
              if (f.x > width + 20) f.x = -20;
              if (f.y < -20) f.y = height + 20;
              if (f.y > height + 20) f.y = -20;
            }

            // Pulsing warm amber & gold fairy glow
            const pulse = 0.4 + 0.6 * Math.pow(Math.sin(time * f.pulseSpeed + f.pulsePhase), 2);
            const glowR = f.r * 5;

            const glow = fCtx.createRadialGradient(f.x, f.y, 0, f.x, f.y, glowR);
            glow.addColorStop(0, `rgba(255, 235, 140, ${pulse * 0.95})`);
            glow.addColorStop(0.35, `rgba(255, 185, 75, ${pulse * 0.6})`);
            glow.addColorStop(1, 'rgba(255, 170, 66, 0)');

            fCtx.fillStyle = glow;
            fCtx.beginPath();
            fCtx.arc(f.x, f.y, glowR, 0, Math.PI * 2);
            fCtx.fill();

            // Core sparkle point
            fCtx.fillStyle = `rgba(255, 255, 240, ${pulse})`;
            fCtx.beginPath();
            fCtx.arc(f.x, f.y, f.r * 0.8, 0, Math.PI * 2);
            fCtx.fill();
          });

          animId = requestAnimationFrame(renderFireflies);
        }

        animId = requestAnimationFrame(renderFireflies);
      }

      /* -------------------------------------------------------------
       * 5. ZOOM-THROUGH TRANSITION (Walking Through the Arch to White)
       * ------------------------------------------------------------*/
      let isTransitioning = false;

      if (btnExplore) {
        btnExplore.addEventListener('click', (e) => {
          e.preventDefault();
          if (isTransitioning) return;
          isTransitioning = true;

          // Sound effect chime
          try {
            const AudioClass = window.AudioContext || window.webkitAudioContext;
            if (AudioClass) {
              const aCtx = new AudioClass();
              const osc = aCtx.createOscillator();
              const gain = aCtx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(523.25, aCtx.currentTime); // C5
              osc.frequency.exponentialRampToValueAtTime(1046.50, aCtx.currentTime + 1.2); // C6
              gain.gain.setValueAtTime(0.001, aCtx.currentTime);
              gain.gain.linearRampToValueAtTime(0.3, aCtx.currentTime + 0.1);
              gain.gain.exponentialRampToValueAtTime(0.001, aCtx.currentTime + 1.4);
              osc.connect(gain);
              gain.connect(aCtx.destination);
              osc.start();
              osc.stop(aCtx.currentTime + 1.4);
            }
          } catch (err) {}

          const tl = gsap.timeline({
            onComplete: () => {
              // Seamless route to garden page
              window.location.href = 'garden.html';
            }
          });

          // 1. Button click compression
          tl.to(btnExplore, { scale: 0.94, duration: 0.15, ease: "power2.in" })
            .to(btnExplore, { scale: 1.15, opacity: 0, duration: 0.35, ease: "power2.out" }, "<0.12");

          // 2. Archway (Layer 3) scales up massively (zoom-in), camera passes through opening
          tl.to(layer3, {
            scale: 8.5,
            opacity: 0.1,
            transformOrigin: "center center",
            duration: 1.6,
            ease: "power3.in"
          }, 0.15);

          // 3. Layer 2 (Vines & Lanterns) pushes outward and zooms past
          tl.to(layer2, {
            scale: 5.2,
            opacity: 0,
            transformOrigin: "center center",
            duration: 1.35,
            ease: "power2.in"
          }, 0.15);

          // 4. Layer 1 (Rose & Typography) rushes toward the viewer
          tl.to(layer1, {
            scale: 2.6,
            opacity: 0.1,
            transformOrigin: "center center",
            duration: 1.35,
            ease: "power2.in"
          }, 0.15);

          // 5. Screen fades to radiant white, simulating entering the portal
          tl.to(flashOverlay, {
            opacity: 1,
            duration: 1.15,
            ease: "power2.inOut"
          }, 0.45);
        });
      }

      /* Cleanup on page exit */
      document.addEventListener('page:before-exit', () => {
        if (animId) cancelAnimationFrame(animId);
      }, { once: true });

    })();
  </script>

  <!-- Persistent Background Music Controller -->
  <script src="js/seamless.js"></script>
</body>
</html>
