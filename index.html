<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#160f1b">
  <meta name="description" content="Một món quà nhỏ lung linh dành riêng cho ngày sinh nhật đặc biệt.">

  <title>For You, With Love 🌹 · Happy Birthday</title>

  <link rel="stylesheet" href="css/style.css">
  <style>
    #bg-particles {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .welcome-content {
      position: relative;
      z-index: 1;
    }

    .hero-rose-container {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
    }

    .hero-rose-halo {
      position: absolute;
      inset: -15px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(241, 165, 193, 0.22) 0%, rgba(241, 165, 193, 0.03) 65%, transparent 75%);
      filter: blur(12px);
      animation: pulse-halo 4s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .hero-rose-ring {
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(255, 225, 235, 0.2);
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(241, 165, 193, 0.15), inset 0 0 20px rgba(241, 165, 193, 0.08);
      pointer-events: none;
    }

    #hero-rose-canvas {
      position: relative;
      z-index: 1;
      width: 165px;
      height: 165px;
      filter: drop-shadow(0 12px 25px rgba(0, 0, 0, 0.45));
    }

    @keyframes pulse-halo {
      0% { transform: scale(0.92); opacity: 0.6; }
      100% { transform: scale(1.08); opacity: 1; }
    }
  </style>
</head>

<body>
  <main class="welcome-screen">
    <canvas id="bg-particles" aria-hidden="true"></canvas>

    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <section class="welcome-content">
      <p class="eyebrow">A LITTLE SURPRISE, MADE WITH LOVE</p>

      <div class="hero-rose-container" aria-label="Bông hoa hồng nở rộ">
        <div class="hero-rose-halo"></div>
        <div class="hero-rose-ring"></div>
        <canvas id="hero-rose-canvas" width="360" height="360"></canvas>
      </div>

      <p class="date-label">A SPECIAL DAY FOR SOMEONE SPECIAL</p>

      <h1>
        Happy Birthday,<br>
        <span>My Special Person</span>
      </h1>

      <p class="welcome-description">
        Có một khu vườn bí mật cùng những điều dịu dàng nhất mình đã chuẩn bị dành riêng cho cậu hôm nay.
      </p>

      <a class="open-garden-button" href="garden.html">
        <span>Khám phá khu vườn</span>
        <span aria-hidden="true">♡</span>
      </a>

      <p class="footer-note">
        Take a deep breath & enjoy every moment ♡
      </p>
    </section>
  </main>

  <script src="js/garden-botany.js"></script>
  <script>
    (() => {
      'use strict';

      // 1. Render Living Botanical Rose Sprite on Hero Canvas
      const roseCanvas = document.getElementById('hero-rose-canvas');
      if (roseCanvas && window.GardenBotany) {
        const rCtx = roseCanvas.getContext('2d');
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const size = 360;

        const rose = GardenBotany.createRealisticRoseSprite({
          radius: 95,
          paletteKey: 'sweetBlush',
          variety: 'peony',
          tiltX: -0.15,
          tiltY: -0.2,
          seed: 2026,
          hasDewdrop: true
        });

        let start = 0;
        function renderRoseFrame(timestamp) {
          if (!start) start = timestamp;
          const time = (timestamp - start) / 1000;

          rCtx.clearRect(0, 0, size, size);
          rCtx.save();
          rCtx.translate(size / 2, size / 2);

          // Gentle organic breathing & floating tilt
          const breath = 1 + Math.sin(time * 1.6) * 0.022;
          const tilt = Math.sin(time * 1.2) * 0.04;
          rCtx.scale(breath, breath);
          rCtx.rotate(tilt);

          const rSize = rose.logicalSize * (95 / rose.radius);
          const half = rSize / 2;

          rCtx.drawImage(rose.baseCanvas, -half, -half, rSize, rSize);
          rose.whorlCanvases.forEach(layer => {
            rCtx.drawImage(layer, -half, -half, rSize, rSize);
          });

          rCtx.restore();
          requestAnimationFrame(renderRoseFrame);
        }
        requestAnimationFrame(renderRoseFrame);
      }

      // 2. Background Drifting Starlight & Fireflies
      const bgCanvas = document.getElementById('bg-particles');
      if (bgCanvas) {
        const bCtx = bgCanvas.getContext('2d');
        let width = 0, height = 0;

        const stars = Array.from({ length: 45 }, () => ({
          x: Math.random(),
          y: Math.random(),
          r: 0.8 + Math.random() * 1.6,
          speed: 1.2 + Math.random() * 2,
          phase: Math.random() * Math.PI * 2
        }));

        const fireflies = Array.from({ length: 22 }, () => ({
          x: Math.random(),
          y: Math.random(),
          r: 1.8 + Math.random() * 2.2,
          vx: (Math.random() - 0.5) * 0.015,
          vy: -0.01 - Math.random() * 0.02,
          phase: Math.random() * Math.PI * 2
        }));

        function resize() {
          width = bgCanvas.width = window.innerWidth;
          height = bgCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let lastT = 0;
        function drawParticles(t) {
          const delta = Math.min((t - lastT) / 1000, 0.05);
          lastT = t;
          const time = t / 1000;

          bCtx.clearRect(0, 0, width, height);

          // Twinkling stars
          stars.forEach(s => {
            const alpha = 0.25 + 0.75 * Math.pow(Math.sin(time * s.speed + s.phase), 2);
            bCtx.fillStyle = `rgba(255, 235, 245, ${alpha})`;
            bCtx.beginPath();
            bCtx.arc(s.x * width, s.y * height, s.r, 0, Math.PI * 2);
            bCtx.fill();
          });

          // Soft drifting fireflies
          fireflies.forEach(f => {
            f.x += f.vx * delta * 60;
            f.y += f.vy * delta * 60;

            if (f.y < -0.05) f.y = 1.05;
            if (f.x < -0.05) f.x = 1.05;
            if (f.x > 1.05) f.x = -0.05;

            const pulse = 0.35 + 0.65 * Math.pow(Math.sin(time * 2.2 + f.phase), 2);
            const fx = f.x * width + Math.sin(time * 1.5 + f.phase) * 14;
            const fy = f.y * height;

            const glow = bCtx.createRadialGradient(fx, fy, 0, fx, fy, f.r * 4.5);
            glow.addColorStop(0, `rgba(255, 220, 160, ${pulse * 0.9})`);
            glow.addColorStop(0.4, `rgba(241, 165, 193, ${pulse * 0.4})`);
            glow.addColorStop(1, 'rgba(241, 165, 193, 0)');

            bCtx.fillStyle = glow;
            bCtx.beginPath();
            bCtx.arc(fx, fy, f.r * 4.5, 0, Math.PI * 2);
            bCtx.fill();
          });

          requestAnimationFrame(drawParticles);
        }
        requestAnimationFrame(drawParticles);
      }
    })();
  </script>
</body>
</html>
