  <!-- Base Custom CSS -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* Fallback & Core Styles for Instant Zero-FOUC Rendering */
    body.archway-body {
      height: 100vh;
      height: 100svh;
      width: 100vw;
      overflow: hidden;
      background-color: #120b22;
      color: #fdf8f2;
      position: relative;
      user-select: none;
      font-family: var(--font-sans);
    }

    .archway-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      will-change: transform;
    }

    #layer-1 {
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at 50% 35%, rgba(92, 42, 98, 0.48) 0%, transparent 62%),
        linear-gradient(180deg, #0c0617 0%, #1a122e 52%, #2d1c44 100%);
    }

    #layer-2 {
      z-index: 20;
      pointer-events: none;
      filter: drop-shadow(0 10px 22px rgba(8, 4, 16, 0.72));
    }

    #layer-3 {
      z-index: 30;
      pointer-events: none;
      filter: drop-shadow(0 16px 34px rgba(5, 2, 12, 0.9)) drop-shadow(0 3px 8px rgba(8, 4, 16, 0.75));
    }

    /* Centerpiece & Rose Medallion */
    .archway-centerpiece {
      position: relative;
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 20px;
      max-width: 640px;
      margin: 0 auto;
      pointer-events: auto;
    }

    #rose-glow {
      position: absolute;
      top: 96px;
      left: 50%;
      width: 310px;
      height: 310px;
      margin-left: -155px;
      margin-top: -155px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 62, 108, 0.52) 0%, rgba(255, 216, 117, 0.32) 42%, rgba(255, 170, 66, 0) 72%);
      filter: blur(26px);
      pointer-events: none;
    }

    .rose-medallion-frame {
      position: relative;
      width: 196px;
      height: 196px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      cursor: pointer;
      filter: drop-shadow(0 14px 28px rgba(45, 5, 18, 0.8)) drop-shadow(0 3px 6px rgba(10, 5, 20, 0.5));
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .rose-medallion-frame:hover {
      transform: scale(1.06) translateY(-3px);
    }

    .rose-filigree-ring {
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      border: 1.5px dashed rgba(255, 216, 117, 0.55);
      box-shadow: 0 0 28px rgba(255, 216, 117, 0.22), inset 0 0 22px rgba(255, 216, 117, 0.15);
      animation: slowRingSpin 36s linear infinite;
      pointer-events: none;
    }

    .rose-filigree-ring-inner {
      position: absolute;
      inset: 16px;
      border-radius: 50%;
      border: 1px solid rgba(242, 199, 206, 0.3);
      pointer-events: none;
    }

    /* Lantern swinging and glow dynamics */
    .lantern-unit {
      position: absolute;
      top: 0;
      transform-origin: top center;
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lantern-glow-mesh {
      box-shadow: 0 0 26px 10px rgba(255, 216, 117, 0.7), 0 0 60px 22px rgba(255, 170, 66, 0.35);
      transition: box-shadow 0.4s ease, transform 0.4s ease;
    }

    .lantern-unit:hover .lantern-glow-mesh {
      box-shadow: 0 0 42px 16px rgba(255, 216, 117, 1), 0 0 85px 32px rgba(255, 170, 66, 0.65);
    }

    /* Text glow */
    .text-shadow-gold {
      text-shadow: 0 0 16px rgba(255, 216, 117, 0.6), 0 0 32px rgba(255, 170, 66, 0.35);
    }

    .text-shadow-rose {
      text-shadow: 0 0 20px rgba(242, 199, 206, 0.65), 0 4px 18px rgba(10, 5, 20, 0.8);
    }

    /* Glowing Explore Button */
    .btn-explore-glow {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 15px 42px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(220, 162, 174, 0.38) 0%, rgba(138, 36, 75, 0.88) 55%, rgba(80, 19, 43, 0.95) 100%);
      border: 1.5px solid #ffd875;
      color: #ffffff;
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow:
        0 0 26px rgba(255, 216, 117, 0.48),
        0 10px 32px rgba(10, 5, 20, 0.75),
        inset 0 1px 2px rgba(255, 255, 255, 0.65);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    .btn-explore-glow::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 244, 184, 0.35), transparent);
      transform: skewX(-20deg);
      animation: buttonShimmer 4.5s infinite;
    }

    @keyframes buttonShimmer {
      0%, 60% { left: -100%; }
      100% { left: 160%; }
    }

    .btn-explore-glow:hover {
      box-shadow:
        0 0 42px rgba(255, 216, 117, 0.85),
        0 14px 42px rgba(10, 5, 20, 0.85),
        inset 0 1px 3px rgba(255, 255, 255, 0.9);
      transform: translateY(-3px) scale(1.04);
      border-color: #fff4b8;
    }

    .btn-explore-glow:active {
      transform: translateY(1px) scale(0.98);
    }

    /* Storybook Chapter Stepper */
    .storybook-stepper {
      position: fixed;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 45;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(20, 12, 36, 0.72);
      border: 1px solid rgba(255, 216, 117, 0.28);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 6px 20px rgba(5, 2, 12, 0.6);
      font-size: 11px;
      color: var(--paper-kraft);
      letter-spacing: 0.08em;
    }

    .step-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(242, 199, 206, 0.3);
      transition: all 0.3s ease;
    }

    .step-dot.active {
      width: 20px;
      border-radius: 999px;
      background: #ffd875;
      box-shadow: 0 0 10px #ffd875;
    }
  </style>
</head>

  <div id="flash-overlay" class="fixed inset-0 z-50 bg-[#fffaf2] pointer-events-none opacity-0" style="position:fixed;inset:0;z-index:50;background:#fffaf2;pointer-events:none;opacity:0;"></div>

  <!-- ============================================================
       CORE JAVASCRIPT: GSAP PARALLAX, FIREFLIES, HOVER PHYSICS & ZOOM
       ============================================================ -->
  <script>
    (() => {
      'use strict';

      /* DOM Elements */
      const layer1 = document.getElementById('layer-1');
      const layer2 = document.getElementById('layer-2');
      const layer3 = document.getElementById('layer-3');
      const roseGlow = document.getElementById('rose-glow');
      const paperRose = document.getElementById('paper-rose');
      const btnExplore = document.getElementById('btn-explore');
      const flashOverlay = document.getElementById('flash-overlay');
      const firefliesCanvas = document.getElementById('fireflies-canvas');

      /* Web Audio Chime Synthesizer */
      let audioCtx = null;
      function playNote(freq = 659.25, dur = 1.4, vol = 0.18) {
        try {
          const AudioClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioClass) return;
          if (!audioCtx) audioCtx = new AudioClass();
          if (audioCtx.state === 'suspended') audioCtx.resume();

          const t = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t);

          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.linearRampToValueAtTime(vol, t + 0.008);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + dur);
        } catch (e) {}
      }

      /* Mouse Tracking State */
      const mouse = {
        x: window.innerWidth / 2,
        y: window.innerHeight / 2,
        normX: 0,
        normY: 0,
        isActive: false
      };

      function updateParallax(clientX, clientY) {
        mouse.x = clientX;
        mouse.y = clientY;
        mouse.normX = (clientX / window.innerWidth - 0.5) * 2; // -1 to 1
        mouse.normY = (clientY / window.innerHeight - 0.5) * 2; // -1 to 1
        mouse.isActive = true;

        if (typeof gsap === 'undefined') return;

        /* -------------------------------------------------------------
         * 1. MOUSE PARALLAX (GSAP): 
         * Layer 3 moves slightly opposite, Layer 2 moderately, Layer 1 stays mostly still
         * ------------------------------------------------------------*/
        gsap.to(layer3, {
          x: -mouse.normX * 28,
          y: -mouse.normY * 18,
          rotationX: mouse.normY * 2.5,
          rotationY: -mouse.normX * 2.5,
          duration: 1.1,
          ease: 'power2.out',
          overwrite: 'auto'
        });

        gsap.to(layer2, {
          x: mouse.normX * 18,
          y: mouse.normY * 12,
          rotationX: -mouse.normY * 1.8,
          rotationY: mouse.normX * 1.8,
          duration: 1.0,
          ease: 'power2.out',
          overwrite: 'auto'
        });

        gsap.to(layer1, {
          x: mouse.normX * 6,
          y: mouse.normY * 4,
          duration: 1.3,
          ease: 'power2.out',
          overwrite: 'auto'
        });
      }

      const onMouseMove = (e) => updateParallax(e.clientX, e.clientY);
      const onTouchMove = (e) => {
        if (e.touches && e.touches[0]) {
          updateParallax(e.touches[0].clientX, e.touches[0].clientY);
        }
      };

      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('touchmove', onTouchMove, { passive: true });

      /* -------------------------------------------------------------
       * 2. PULSING CENTER: HEARTBEAT ANIMATION ON ROSE RADIAL GLOW
       * ------------------------------------------------------------*/
      if (roseGlow && typeof gsap !== 'undefined') {
        const heartbeatTL = gsap.timeline({ repeat: -1, delay: 0.1 });
        heartbeatTL
          .to(roseGlow, { scale: 1.18, opacity: 0.95, duration: 0.22, ease: 'power2.out' })
          .to(roseGlow, { scale: 1.04, opacity: 0.72, duration: 0.16, ease: 'power1.in' })
          .to(roseGlow, { scale: 1.26, opacity: 1.0, duration: 0.26, ease: 'power2.out' })
          .to(roseGlow, { scale: 1.0, opacity: 0.65, duration: 0.65, ease: 'sine.inOut' })
          .to({}, { duration: 0.85 });
      }

      /* -------------------------------------------------------------
       * 3. HOVER PHYSICS ON 4 SWINGING PAPER LANTERNS
       * ------------------------------------------------------------*/
      const lanterns = [
        { id: 'lantern-1', baseAmp: 3.5, baseDur: 2.4, isEven: true, note: 659.25 },
        { id: 'lantern-2', baseAmp: -3.0, baseDur: 2.1, isEven: false, note: 783.99 },
        { id: 'lantern-3', baseAmp: 3.0, baseDur: 2.2, isEven: true, note: 880.00 },
        { id: 'lantern-4', baseAmp: -3.5, baseDur: 2.5, isEven: false, note: 1046.50 }
      ];

      if (typeof gsap !== 'undefined') {
        lanterns.forEach(cfg => {
          const el = document.getElementById(cfg.id);
          if (!el) return;

          const glowMesh = el.querySelector('.lantern-glow-mesh');

          let currentSwing = gsap.to(el, {
            rotation: cfg.baseAmp,
            duration: cfg.baseDur,
            repeat: -1,
            yoyo: true,
            ease: 'sine.inOut',
            transformOrigin: 'top center'
          });

          el.addEventListener('mouseenter', () => {
            playNote(cfg.note, 1.1, 0.12);
            currentSwing.kill();
            currentSwing = gsap.to(el, {
              rotation: cfg.isEven ? 9.5 : -9.5,
              duration: 0.52,
              repeat: -1,
              yoyo: true,
              ease: 'power1.inOut',
              transformOrigin: 'top center'
            });

            if (glowMesh) {
              gsap.to(glowMesh, {
                scale: 1.55,
                opacity: 1,
                duration: 0.35,
                ease: 'power2.out'
              });
            }
          });

          el.addEventListener('mouseleave', () => {
            currentSwing.kill();
            currentSwing = gsap.to(el, {
              rotation: cfg.baseAmp,
              duration: cfg.baseDur,
              repeat: -1,
              yoyo: true,
              ease: 'sine.inOut',
              transformOrigin: 'top center'
            });

            if (glowMesh) {
              gsap.to(glowMesh, {
                scale: 1,
                opacity: 0.88,
                duration: 0.6,
                ease: 'power2.out'
              });
            }
          });
        });
      }

      /* -------------------------------------------------------------
       * 4. INTERACTIVE FIREFLIES & ROSE PETAL BURST CANVAS
       *    (30% of fireflies gravitate towards user's cursor)
       * ------------------------------------------------------------*/
      let animId = null;
      const roseBurstPetals = [];

      function spawnRosePetalBurst(originX, originY) {
        const colors = ['#e11d48', '#f43f5e', '#fb7185', '#ffd875', '#ffe4e6'];
        for (let i = 0; i < 28; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 50 + Math.random() * 140;
          roseBurstPetals.push({
            x: originX,
            y: originY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 35,
            size: 4 + Math.random() * 5,
            color: colors[Math.floor(Math.random() * colors.length)],
            rot: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 6,
            age: 0,
            life: 1.5 + Math.random() * 0.9
          });
        }
      }

      if (paperRose) {
        paperRose.addEventListener('click', () => {
          const rect = paperRose.getBoundingClientRect();
          spawnRosePetalBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);
          playNote(587.33, 1.2, 0.18);
          setTimeout(() => playNote(880, 1.5, 0.18), 90);
          if (typeof gsap !== 'undefined') {
            gsap.fromTo(paperRose, { scale: 0.92 }, { scale: 1.06, duration: 0.45, ease: 'elastic.out(1, 0.4)' });
          }
        });
      }

      if (firefliesCanvas) {
        const fCtx = firefliesCanvas.getContext('2d');
        let width = 0, height = 0;

        function resizeCanvas() {
          width = firefliesCanvas.width = window.innerWidth;
          height = firefliesCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const fireflyCount = 60;
        const fireflies = [];
        // Exactly 30% of fireflies gravitate towards user's cursor
        const gravitatingCount = Math.floor(fireflyCount * 0.30);

        for (let i = 0; i < fireflyCount; i++) {
          const isGravitating = i < gravitatingCount;
          fireflies.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.9,
            vy: (Math.random() - 0.5) * 0.9,
            r: isGravitating ? (1.8 + Math.random() * 2.2) : (1.2 + Math.random() * 1.8),
            pulsePhase: Math.random() * Math.PI * 2,
            pulseSpeed: 1.8 + Math.random() * 2.4,
            isGravitating
          });
        }

        const stars = Array.from({ length: 52 }, () => ({
          x: Math.random(),
          y: Math.random(),
          r: 0.8 + Math.random() * 1.6,
          speed: 1.0 + Math.random() * 2.2,
          phase: Math.random() * Math.PI * 2
        }));

        let lastT = performance.now();

        function renderFireflies(now) {
          const delta = Math.min((now - lastT) / 1000, 0.05);
          lastT = now;
          const time = now / 1000;

          fCtx.clearRect(0, 0, width, height);

          // 1. Twinkling Night Stars
          stars.forEach(s => {
            const alpha = 0.25 + 0.75 * Math.pow(Math.sin(time * s.speed + s.phase), 2);
            fCtx.fillStyle = `rgba(255, 244, 210, ${alpha})`;
            fCtx.beginPath();
            fCtx.arc(s.x * width, s.y * height, s.r, 0, Math.PI * 2);
            fCtx.fill();
          });

          // 2. Fireflies (70% ambient + 30% gravitating towards mouse)
          fireflies.forEach(f => {
            if (f.isGravitating && mouse.isActive) {
              const dx = mouse.x - f.x;
              const dy = mouse.y - f.y;
              const dist = Math.hypot(dx, dy);

              if (dist > 28) {
                f.vx += (dx / dist) * 0.14;
                f.vy += (dy / dist) * 0.14;
                f.vx += (-dy / dist) * 0.07;
                f.vy += (dx / dist) * 0.07;
              }

              f.vx *= 0.94;
              f.vy *= 0.94;

              const spd = Math.hypot(f.vx, f.vy);
              if (spd > 3.2) {
                f.vx = (f.vx / spd) * 3.2;
                f.vy = (f.vy / spd) * 3.2;
              }

              f.x += f.vx;
              f.y += f.vy;
            } else {
              f.x += f.vx * delta * 60;
              f.y += f.vy * delta * 60;

              if (f.x < -20) f.x = width + 20;
              if (f.x > width + 20) f.x = -20;
              if (f.y < -20) f.y = height + 20;
              if (f.y > height + 20) f.y = -20;
            }

            const pulse = 0.4 + 0.6 * Math.pow(Math.sin(time * f.pulseSpeed + f.pulsePhase), 2);
            const glowR = f.r * 5;

            const glow = fCtx.createRadialGradient(f.x, f.y, 0, f.x, f.y, glowR);
            glow.addColorStop(0, `rgba(255, 235, 140, ${pulse * 0.95})`);
            glow.addColorStop(0.35, `rgba(255, 185, 75, ${pulse * 0.6})`);
            glow.addColorStop(1, 'rgba(255, 170, 66, 0)');

            fCtx.fillStyle = glow;
            fCtx.beginPath();
            fCtx.arc(f.x, f.y, glowR, 0, Math.PI * 2);
            fCtx.fill();

            fCtx.fillStyle = `rgba(255, 255, 240, ${pulse})`;
            fCtx.beginPath();
            fCtx.arc(f.x, f.y, f.r * 0.8, 0, Math.PI * 2);
            fCtx.fill();
          });

          // 3. Interactive Rose Petals Burst
          for (let i = roseBurstPetals.length - 1; i >= 0; i--) {
            const p = roseBurstPetals[i];
            p.age += delta;
            if (p.age >= p.life) {
              roseBurstPetals.splice(i, 1);
              continue;
            }
            p.x += p.vx * delta;
            p.y += p.vy * delta;
            p.vy += 65 * delta;
            p.vx *= 0.98;
            p.rot += p.rotSpeed * delta;

            const alpha = 1 - p.age / p.life;
            fCtx.save();
            fCtx.globalAlpha = alpha;
            fCtx.translate(p.x, p.y);
            fCtx.rotate(p.rot);
            fCtx.fillStyle = p.color;
            fCtx.beginPath();
            fCtx.ellipse(0, 0, p.size, p.size * 0.65, 0, 0, Math.PI * 2);
            fCtx.fill();
            fCtx.restore();
          }

          animId = requestAnimationFrame(renderFireflies);
        }

        animId = requestAnimationFrame(renderFireflies);

        document.addEventListener('page:before-exit', () => {
          if (animId) cancelAnimationFrame(animId);
          window.removeEventListener('resize', resizeCanvas);
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('touchmove', onTouchMove);
        }, { once: true });
      }

      /* -------------------------------------------------------------
       * 5. ZOOM-THROUGH TRANSITION (Walking Through the Arch to Garden)
       * ------------------------------------------------------------*/
      let isTransitioning = false;

      if (btnExplore) {
        btnExplore.addEventListener('click', (e) => {
          e.preventDefault();
          if (isTransitioning) return;
          isTransitioning = true;

          // Ensure background music plays on user's first gesture
          if (window.ensureMusicPlayingOnGesture) {
            window.ensureMusicPlayingOnGesture();
          }

          // Ascending harp arpeggio chime
          playNote(523.25, 1.2, 0.2); // C5
          setTimeout(() => playNote(659.25, 1.3, 0.2), 110); // E5
          setTimeout(() => playNote(783.99, 1.4, 0.2), 220); // G5
          setTimeout(() => playNote(1046.50, 1.8, 0.24), 340); // C6

          const navigateToGarden = () => {
            if (window.navigateSeamless) {
              window.navigateSeamless('garden.html');
            } else {
              window.location.href = 'garden.html';
            }
          };

          if (typeof gsap === 'undefined') {
            navigateToGarden();
            return;
          }

          const tl = gsap.timeline({
            onComplete: navigateToGarden
          });

          // 1. Button click compression
          tl.to(btnExplore, { scale: 0.94, duration: 0.14, ease: 'power2.in' })
            .to(btnExplore, { scale: 1.15, opacity: 0, duration: 0.35, ease: 'power2.out' }, '<0.12');

          // 2. Archway (Layer 3) scales up massively (zoom-in), camera walks through opening
          tl.to(layer3, {
            scale: 8.5,
            opacity: 0.08,
            transformOrigin: 'center center',
            duration: 1.55,
            ease: 'power3.in'
          }, 0.15);

          // 3. Layer 2 (Vines & Lanterns) parts outward and zooms past
          tl.to(layer2, {
            scale: 5.2,
            opacity: 0,
            transformOrigin: 'center center',
            duration: 1.3,
            ease: 'power2.in'
          }, 0.15);

          // 4. Layer 1 (Rose & Typography) rushes toward the viewer
          tl.to(layer1, {
            scale: 2.5,
            opacity: 0.12,
            transformOrigin: 'center center',
            duration: 1.3,
            ease: 'power2.in'
          }, 0.15);

          // 5. Screen fades to warm radiant light, simulating entering the portal
          tl.to(flashOverlay, {
            opacity: 1,
            duration: 1.1,
            ease: 'power2.inOut'
          }, 0.45);
        });
      }

    })();
  </script>
