<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a122e">
  <meta name="description" content="Một cánh cổng cổ tích bước vào khu vườn giấy 3D lung linh dành riêng cho ngày sinh nhật.">

  <title>For You, With Love 🌹 · Happy Birthday</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Global Reusable SVG Filters for 3D Papercut Depth & Fairy Glows -->
  <svg class="paper-filters" aria-hidden="true" style="position: absolute; width: 0; height: 0; pointer-events: none;">
    <defs>
      <!-- Multi-Stop Paper Cut Drop Shadow -->
      <filter id="paper-cut-shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="2" dy="5" stdDeviation="6" flood-color="#0a0514" flood-opacity="0.55" />
        <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0a0514" flood-opacity="0.45" />
      </filter>
      <!-- Warm Fairy Light / Lantern Glow Filter -->
      <filter id="paper-glow-filter" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
  </svg>

  <div class="shadowbox-vignette"></div>

  <!-- Persistent Sound Toggle Button -->
  <div style="position: absolute; top: max(20px, env(safe-area-inset-top)); right: clamp(16px, 4vw, 42px); z-index: 100;">
    <button class="garden-sound-button" id="sound-toggle" type="button" aria-pressed="false">♫ Nhạc nền</button>
  </div>

  <main class="welcome-shadowbox">
    <!-- Starry & Firefly Celestial Canvas -->
    <canvas id="bg-particles" aria-hidden="true"></canvas>

    <!-- 3D LAYERED PAPERCUT FOREST GATE / ARCHWAY (SHADOWBOX PORTAL) -->
    <div class="shadowbox-portal-frame" aria-hidden="true">
      <svg class="portal-svg-layer portal-layer-back" viewBox="0 0 1440 900" preserveAspectRatio="none">
        <!-- Distant Layer 1: Dusky Plum Forest Hills & Distant Silhouettes -->
        <path d="M0,900 L0,560 Q340,490 720,530 Q1100,570 1440,510 L1440,900 Z" fill="#2d1c44" opacity="0.8" />
        <path d="M0,900 L0,620 Q360,570 720,600 Q1080,630 1440,580 L1440,900 Z" fill="#352042" />
      </svg>

      <svg class="portal-svg-layer portal-layer-mid" viewBox="0 0 1440 900" preserveAspectRatio="none">
        <!-- Mid-ground Layer 2: Mauve Tree Canopies arching in from Left and Right -->
        <!-- Left Canopy Bough -->
        <path d="M-40,0 L320,0 C290,140 210,210 110,260 C60,285 -10,320 -40,340 Z" fill="#3d234a" />
        <path d="M-20,0 L240,0 C210,90 140,150 50,180 Z" fill="#52325c" opacity="0.9" />

        <!-- Right Canopy Bough -->
        <path d="M1480,0 L1120,0 C1150,140 1230,210 1330,260 C1380,285 1450,320 1480,340 Z" fill="#3d234a" />
        <path d="M1460,0 L1200,0 C1230,90 1300,150 1390,180 Z" fill="#52325c" opacity="0.9" />

        <!-- Fairy Paper Lantern 1 (Left branch) -->
        <g class="paper-lantern" transform="translate(180, 160)">
          <line x1="0" y1="-80" x2="0" y2="0" stroke="rgba(255, 216, 117, 0.45)" stroke-dasharray="3 3" stroke-width="1.5" />
          <path d="M-10,0 L10,0 L14,24 L-14,24 Z" fill="#26132f" stroke="#ffd875" stroke-width="1.2" />
          <circle cx="0" cy="12" r="7" fill="#ffd875" class="lantern-glow-bulb" />
          <circle cx="0" cy="12" r="18" fill="rgba(255, 216, 117, 0.25)" filter="url(#paper-glow-filter)" />
          <polygon points="0,24 -5,34 5,34" fill="#dca2ae" />
        </g>

        <!-- Fairy Paper Lantern 2 (Right branch) -->
        <g class="paper-lantern delay-1" transform="translate(1260, 160)">
          <line x1="0" y1="-80" x2="0" y2="0" stroke="rgba(255, 216, 117, 0.45)" stroke-dasharray="3 3" stroke-width="1.5" />
          <path d="M-10,0 L10,0 L14,24 L-14,24 Z" fill="#26132f" stroke="#ffd875" stroke-width="1.2" />
          <circle cx="0" cy="12" r="7" fill="#ffd875" class="lantern-glow-bulb" />
          <circle cx="0" cy="12" r="18" fill="rgba(255, 216, 117, 0.25)" filter="url(#paper-glow-filter)" />
          <polygon points="0,24 -5,34 5,34" fill="#dca2ae" />
        </g>

        <!-- Fairy Paper Lantern 3 (Higher subtle accent) -->
        <g class="paper-lantern delay-2" transform="translate(360, 60)">
          <line x1="0" y1="-40" x2="0" y2="0" stroke="rgba(255, 216, 117, 0.35)" stroke-dasharray="3 3" stroke-width="1.2" />
          <path d="M-7,0 L7,0 L10,18 L-10,18 Z" fill="#26132f" stroke="#ffd875" stroke-width="1" />
          <circle cx="0" cy="9" r="5" fill="#fff4b8" class="lantern-glow-bulb" />
          <circle cx="0" cy="9" r="14" fill="rgba(255, 216, 117, 0.2)" filter="url(#paper-glow-filter)" />
        </g>
      </svg>

      <svg class="portal-svg-layer portal-layer-front" viewBox="0 0 1440 900" preserveAspectRatio="none">
        <!-- Foreground Layer 3: Scalloped Papercut Archway & Foliage Cutouts -->
        <!-- Left Scalloped Pillar -->
        <path d="M0,0 L80,0 Q140,240 60,520 Q120,700 80,900 L0,900 Z" fill="#1a122e" />
        <!-- Right Scalloped Pillar -->
        <path d="M1440,0 L1360,0 Q1300,240 1380,520 Q1320,700 1360,900 L1440,900 Z" fill="#1a122e" />
        <!-- Top Arch Silhouette -->
        <path d="M0,0 L1440,0 L1440,36 Q1100,75 720,75 Q340,75 0,36 Z" fill="#140d24" />
      </svg>
    </div>

    <!-- Centerpiece: Fairytale Greeting & 3D Layered Paper Rose Medallion -->
    <section class="welcome-shadowbox-content">
      <p class="shadowbox-eyebrow">✧ A VINTAGE FAIRYTALE SHADOWBOX ✧</p>

      <!-- 3D Layered Papercut Rose Medallion -->
      <div class="paper-rose-medallion" aria-label="Đóa hoa hồng giấy 3D nở rộ">
        <div class="rose-gold-foil-ring"></div>
        <canvas id="hero-rose-canvas" width="360" height="360"></canvas>
      </div>

      <p class="shadowbox-eyebrow" style="font-size: 10px; margin-bottom: 8px; color: var(--paper-kraft);">
        A SPECIAL DAY FOR SOMEONE SPECIAL
      </p>

      <h1>
        Happy Birthday,
        <span>My Special Person ♡</span>
      </h1>

      <p class="welcome-paper-note">
        Có một cuốn sách cổ tích mở ra cả khu vườn bí mật cùng những điều dịu dàng nhất mình đã chuẩn bị dành riêng cho cậu hôm nay.
      </p>

      <a class="cta-button" href="garden.html">
        <span>Khám phá khu vườn</span>
        <span aria-hidden="true">→</span>
      </a>

      <p style="margin-top: 26px; font-family: var(--font-cursive); font-size: 15px; color: rgba(235, 217, 190, 0.7);">
        Chạm nhẹ để bước vào khu vườn giấy diệu kỳ ♡
      </p>
    </section>
  </main>

  <script src="js/garden-botany.js"></script>
  <script>
    (() => {
      'use strict';

      // 1. Render Living Botanical Rose Sprite on Hero Canvas
      const roseCanvas = document.getElementById('hero-rose-canvas');
      let roseAnimId = null;

      if (roseCanvas && window.GardenBotany) {
        const rCtx = roseCanvas.getContext('2d');
        const size = 360;

        const rose = GardenBotany.createRealisticRoseSprite({
          radius: 95,
          paletteKey: 'sweetBlush',
          variety: 'peony',
          tiltX: -0.15,
          tiltY: -0.2,
          seed: 2026,
          hasDewdrop: true
        });

        let start = 0;
        function renderRoseFrame(timestamp) {
          if (!start) start = timestamp;
          const time = (timestamp - start) / 1000;

          rCtx.clearRect(0, 0, size, size);
          rCtx.save();
          rCtx.translate(size / 2, size / 2);

          // Gentle tactile paper breathing & floating tilt
          const breath = 1 + Math.sin(time * 1.6) * 0.024;
          const tilt = Math.sin(time * 1.2) * 0.038;
          rCtx.scale(breath, breath);
          rCtx.rotate(tilt);

          const rSize = rose.logicalSize * (95 / rose.radius);
          const half = rSize / 2;

          rCtx.drawImage(rose.baseCanvas, -half, -half, rSize, rSize);
          rose.whorlCanvases.forEach(layer => {
            rCtx.drawImage(layer, -half, -half, rSize, rSize);
          });

          rCtx.restore();
          roseAnimId = requestAnimationFrame(renderRoseFrame);
        }
        roseAnimId = requestAnimationFrame(renderRoseFrame);
      }

      // 2. Background Drifting Starlight & Fairy Glows
      const bgCanvas = document.getElementById('bg-particles');
      let particleAnimId = null;

      if (bgCanvas) {
        const bCtx = bgCanvas.getContext('2d');
        let width = 0, height = 0;

        const stars = Array.from({ length: 48 }, () => ({
          x: Math.random(),
          y: Math.random(),
          r: 0.8 + Math.random() * 1.8,
          speed: 1.2 + Math.random() * 2,
          phase: Math.random() * Math.PI * 2
        }));

        const fireflies = Array.from({ length: 24 }, () => ({
          x: Math.random(),
          y: Math.random(),
          r: 1.8 + Math.random() * 2.2,
          vx: (Math.random() - 0.5) * 0.015,
          vy: -0.01 - Math.random() * 0.02,
          phase: Math.random() * Math.PI * 2
        }));

        function resize() {
          width = bgCanvas.width = window.innerWidth;
          height = bgCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let lastT = 0;
        function drawParticles(t) {
          const delta = Math.min((t - lastT) / 1000, 0.05);
          lastT = t;
          const time = t / 1000;

          bCtx.clearRect(0, 0, width, height);

          // Twinkling warm paper stars
          stars.forEach(s => {
            const alpha = 0.25 + 0.75 * Math.pow(Math.sin(time * s.speed + s.phase), 2);
            bCtx.fillStyle = `rgba(255, 244, 210, ${alpha})`;
            bCtx.beginPath();
            bCtx.arc(s.x * width, s.y * height, s.r, 0, Math.PI * 2);
            bCtx.fill();
          });

          // Soft drifting golden fireflies
          fireflies.forEach(f => {
            f.x += f.vx * delta * 60;
            f.y += f.vy * delta * 60;

            if (f.y < -0.05) f.y = 1.05;
            if (f.x < -0.05) f.x = 1.05;
            if (f.x > 1.05) f.x = -0.05;

            const pulse = 0.35 + 0.65 * Math.pow(Math.sin(time * 2.2 + f.phase), 2);
            const fx = f.x * width + Math.sin(time * 1.5 + f.phase) * 14;
            const fy = f.y * height;

            const glow = bCtx.createRadialGradient(fx, fy, 0, fx, fy, f.r * 4.5);
            glow.addColorStop(0, `rgba(255, 216, 117, ${pulse * 0.95})`);
            glow.addColorStop(0.4, `rgba(242, 199, 206, ${pulse * 0.4})`);
            glow.addColorStop(1, 'rgba(242, 199, 206, 0)');

            bCtx.fillStyle = glow;
            bCtx.beginPath();
            bCtx.arc(fx, fy, f.r * 4.5, 0, Math.PI * 2);
            bCtx.fill();
          });

          particleAnimId = requestAnimationFrame(drawParticles);
        }
        particleAnimId = requestAnimationFrame(drawParticles);

        document.addEventListener('page:before-exit', () => {
          if (particleAnimId) cancelAnimationFrame(particleAnimId);
          if (roseAnimId) cancelAnimationFrame(roseAnimId);
          window.removeEventListener('resize', resize);
        }, { once: true });
      }
    })();
  </script>
  <script src="js/seamless.js"></script>
</body>
</html>
