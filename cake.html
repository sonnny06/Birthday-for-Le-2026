<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#160f1b">
  <meta name="description" content="Một chiếc bánh sinh nhật nhỏ lung linh dành riêng cho cậu.">
  <title>Make a Wish 🎂 · Happy Birthday</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --night: #160f1b;
      --wine: #28142b;
      --rose: #f1a5c1;
      --gold: #ebd5b3;
      --cream: #fffaf5;
      --text: #fceaf2;
      --muted: #c9b4c4;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      overflow-x: hidden;
      color: var(--text);
      font-family: 'DM Sans', -apple-system, sans-serif;
      text-align: center;
      background:
        radial-gradient(ellipse at 50% 35%, rgba(105, 42, 85, 0.38) 0%, transparent 60%),
        radial-gradient(circle at 50% 65%, rgba(65, 25, 55, 0.45) 0%, transparent 65%),
        linear-gradient(160deg, #120b17 0%, #201124 55%, #131916 100%);
      position: relative;
    }

    #cake-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .cake-page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      animation: appear 1.2s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      padding: 10px 20px;
      color: #ffeaf2;
      text-decoration: none;
      font-size: 13px;
      border: 1px solid rgba(255, 225, 235, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
    }

    .back-link:hover {
      background: rgba(241, 165, 193, 0.15);
      border-color: rgba(241, 165, 193, 0.6);
      transform: translateY(-2px);
    }

    .eyebrow {
      color: var(--rose);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(34px, 6vw, 54px);
      font-weight: 500;
      line-height: 1.2;
      color: var(--cream);
      margin-bottom: 14px;
    }

    h1 span {
      color: var(--rose);
      font-style: italic;
    }

    .description {
      max-width: 440px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    /* ===== ARTISANAL CAKE STAGE ===== */
    .cake-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      min-height: 290px;
      margin: 28px auto 20px;
      padding-bottom: 24px;
    }

    /* Candle ambient glow illuminating surrounding space */
    .candle-ambient-glow {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 205, 120, 0.24) 0%, rgba(255, 160, 100, 0.08) 45%, transparent 70%);
      filter: blur(20px);
      pointer-events: none;
      transition: opacity 1.2s ease, transform 1.2s ease;
      animation: glowFlicker 3s ease-in-out infinite alternate;
    }

    .candle-ambient-glow.dimmed {
      opacity: 0.05;
      transform: translateX(-50%) scale(0.6);
    }

    @keyframes glowFlicker {
      0%, 100% { opacity: 0.85; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.08); }
    }

    .cake-wrapper {
      position: relative;
      width: min(290px, 76vw);
      height: 180px;
      margin-top: 55px;
      filter: drop-shadow(0 16px 30px rgba(0, 0, 0, 0.55));
    }

    /* Porcelain plate */
    .plate {
      position: absolute;
      bottom: -6px;
      left: -9%;
      width: 118%;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(180deg, #fffcfb, #eddce5 65%, #c8b2c0);
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.65), inset 0 2px 4px rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    /* Cake body */
    .cake-tier {
      position: absolute;
      bottom: 12px;
      left: 0;
      width: 100%;
      height: 110px;
      border-radius: 0 0 24px 24px;
      background: linear-gradient(135deg, #f6e8ec 0%, #edd4de 40%, #d8acc0 85%, #b5809a 100%);
      box-shadow: inset 0 -8px 18px rgba(135, 55, 95, 0.35);
      border-bottom: 2px solid rgba(255, 255, 255, 0.4);
    }

    /* Rich chocolate / berry inner sponge layer peeking out */
    .cake-sponge-line {
      position: absolute;
      top: 54px;
      left: 0;
      width: 100%;
      height: 9px;
      background: linear-gradient(90deg, #823658, #ab4f78 50%, #762f4f);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25);
    }

    /* Cake top cream ellipse */
    .cake-top-cream {
      position: absolute;
      top: 48px;
      left: 0;
      width: 100%;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 40%, #fffefe 0%, #faedf3 60%, #eed4df 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 4px 15px rgba(120, 45, 80, 0.15);
      z-index: 2;
    }

    /* Sculpted soft cream drip border */
    .frosting-drips {
      position: absolute;
      top: 68px;
      left: 0;
      width: 100%;
      height: 40px;
      z-index: 3;
      pointer-events: none;
    }

    .frosting-drips svg {
      width: 100%;
      height: 100%;
      fill: #fff9fb;
      filter: drop-shadow(0 3px 5px rgba(125, 40, 75, 0.18));
    }

    /* Fresh decorative raspberries on top */
    .berries-group {
      position: absolute;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 35px;
      z-index: 3;
      pointer-events: none;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .berry {
      width: 14px;
      height: 15px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #e64574 0%, #aa1b44 75%, #640b24 100%);
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.35);
    }

    /* Artisanal Candle */
    .candle-stem {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 11px;
      height: 68px;
      border-radius: 5px 5px 3px 3px;
      background: repeating-linear-gradient(
        140deg,
        #fffdf9 0px,
        #fffdf9 7px,
        #f4b0cb 7px,
        #f4b0cb 13px,
        #e093b1 13px,
        #e093b1 15px
      );
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3), inset -1px 0 3px rgba(0, 0, 0, 0.15);
      z-index: 4;
    }

    .candle-wick {
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 10px;
      background: #4a383b;
      border-radius: 1px;
      z-index: 4;
    }

    /* Realistic Dancing Candle Flame */
    .flame-element {
      position: absolute;
      top: -32px;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 28px;
      border-radius: 50% 50% 35% 35%;
      background: radial-gradient(ellipse at 50% 75%, #ffffff 0%, #fff7be 25%, #ffb648 60%, #ff6b3d 88%, rgba(255, 60, 40, 0) 100%);
      box-shadow:
        0 0 15px #ffcf68,
        0 0 35px #ff9b44,
        0 0 65px rgba(255, 120, 60, 0.6);
      transform-origin: center bottom;
      animation: flameFlicker 0.65s ease-in-out infinite alternate;
      z-index: 5;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .flame-element.out {
      opacity: 0;
      transform: translateX(-50%) scale(0.2);
      pointer-events: none;
    }

    @keyframes flameFlicker {
      0% { transform: translateX(-50%) rotate(-2deg) scale(0.96, 1.03); }
      50% { transform: translateX(-50%) rotate(1.5deg) scale(1.02, 0.98); }
      100% { transform: translateX(-50%) rotate(-1deg) scale(1.04, 1.05); }
    }

    /* Gentle Smoke wisp when extinguished */
    .smoke-wisp {
      position: absolute;
      top: -25px;
      left: 50%;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(220, 210, 215, 0.65);
      filter: blur(3px);
      pointer-events: none;
      opacity: 0;
      z-index: 4;
    }

    .smoke-wisp.active {
      animation: smokeRise 2.2s ease-out forwards;
    }

    @keyframes smokeRise {
      0% { opacity: 0.8; transform: translate(-50%, 0) scale(1); }
      50% { opacity: 0.5; transform: translate(-70%, -35px) scale(3.5); }
      100% { opacity: 0; transform: translate(-30%, -75px) scale(6); }
    }

    /* ===== CONTROLS & WISH SECTION ===== */
    .controls-container {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .wish-main-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 52px;
      padding: 0 30px;
      border: 1px solid rgba(255, 210, 230, 0.45);
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(241, 165, 193, 0.22), rgba(184, 51, 90, 0.35));
      color: #fffafc;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(184, 51, 90, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      transition: all 0.25s ease;
      touch-action: manipulation;
    }

    .wish-main-button:hover {
      background: linear-gradient(135deg, rgba(241, 165, 193, 0.35), rgba(184, 51, 90, 0.5));
      border-color: rgba(255, 225, 240, 0.7);
      box-shadow: 0 14px 40px rgba(241, 165, 193, 0.35);
      transform: translateY(-2px);
    }

    .wish-main-button:active {
      transform: translateY(0);
    }

    .wish-main-button.listening {
      border-color: #ffd27d;
      background: rgba(255, 210, 125, 0.25);
      box-shadow: 0 0 25px rgba(255, 210, 125, 0.4);
      animation: pulseMic 1.4s ease-in-out infinite;
    }

    @keyframes pulseMic {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .manual-tap-button {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 4px;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .manual-tap-button:hover {
      opacity: 1;
      color: var(--cream);
    }

    .wish-display-box {
      min-height: 60px;
      margin: 18px auto 0;
      max-width: 460px;
      color: #ffe6f0;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 18px;
      font-style: italic;
      line-height: 1.7;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
      transition: all 0.5s ease;
    }

    /* Secret Gift Navigation Button */
    .gift-reveal-card {
      margin-top: 14px;
      animation: giftAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes giftAppear {
      from { opacity: 0; transform: translateY(18px) scale(0.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .gift-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 15px 32px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(244, 184, 208, 0.35), rgba(185, 78, 121, 0.45));
      border: 1px solid rgba(255, 215, 235, 0.6);
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      box-shadow: 0 12px 35px rgba(219, 90, 140, 0.35), 0 0 25px rgba(244, 184, 208, 0.2);
      backdrop-filter: blur(14px);
      transition: all 0.3s ease;
      animation: floatPill 3.5s ease-in-out infinite;
    }

    @keyframes floatPill {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .gift-link-btn:hover {
      transform: translateY(-2px);
      border-color: #fff;
      box-shadow: 0 16px 45px rgba(219, 90, 140, 0.5);
      background: linear-gradient(135deg, rgba(244, 184, 208, 0.5), rgba(185, 78, 121, 0.6));
    }

    .footer {
      margin-top: 32px;
      color: rgba(200, 180, 195, 0.6);
      font-size: 12px;
      font-style: italic;
      letter-spacing: 0.05em;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 500px) {
      .cake-wrapper {
        width: 250px;
        height: 160px;
      }
      .cake-tier { height: 95px; }
      .cake-top-cream { height: 46px; }
      .wish-main-button {
        width: 100%;
        max-width: 320px;
      }
    }

    .garden-sound-button,
    #sound-toggle {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 18px;
      border: 1px solid rgba(255, 225, 235, 0.28);
      border-radius: 999px;
      background: rgba(22, 12, 25, 0.72);
      color: #fceaf1;
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      pointer-events: auto;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      transition: all 250ms ease;
    }

    .garden-sound-button:hover,
    #sound-toggle:hover,
    .garden-sound-button[aria-pressed="true"],
    #sound-toggle[aria-pressed="true"],
    .garden-sound-button.playing,
    #sound-toggle.playing {
      border-color: rgba(241, 165, 193, 0.85);
      background: rgba(241, 165, 193, 0.24);
      box-shadow: 0 0 20px rgba(241, 165, 193, 0.4);
      transform: translateY(-1px);
    }

    .garden-sound-button[aria-pressed="true"],
    #sound-toggle[aria-pressed="true"],
    .garden-sound-button.playing,
    #sound-toggle.playing {
      color: #ffe1eb;
      border-color: #f1a5c1;
      background: rgba(241, 165, 193, 0.32);
      box-shadow: 0 0 22px rgba(241, 165, 193, 0.5);
    }
  </style>
</head>

<body class="cake-page-body">
  <canvas id="cake-canvas" aria-hidden="true"></canvas>

  <main class="cake-page">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; gap: 12px; flex-wrap: wrap;">
      <a class="back-link" href="garden.html" style="margin-bottom: 0;">
        <span aria-hidden="true">←</span> Trở về khu vườn
      </a>
      <button class="garden-sound-button" id="sound-toggle" type="button" aria-pressed="false">♫ Nhạc nền</button>
    </div>

    <p class="eyebrow">A LITTLE WISH FOR YOU</p>

    <h1>Make a <span>Wish</span> ♡</h1>

    <p class="description">
      Có một chiếc bánh nhỏ và một ngọn nến lung linh dành riêng cho cậu.
      Hãy nhắm mắt lại ước một điều thật đẹp rồi thổi nến nhé.
    </p>

    <div class="cake-stage" aria-label="Bánh sinh nhật và ngọn nến lung linh">
      <div class="candle-ambient-glow" id="candle-glow"></div>

      <div class="cake-wrapper">
        <div class="plate"></div>
        <div class="cake-tier">
          <div class="cake-sponge-line"></div>
        </div>
        <div class="cake-top-cream"></div>

        <div class="frosting-drips">
          <svg viewBox="0 0 290 40" preserveAspectRatio="none">
            <path d="M0,0 L290,0 L290,8 Q270,22 250,8 Q235,32 220,10 Q200,20 185,6 Q165,28 145,12 Q125,24 105,8 Q85,34 65,10 Q45,26 25,6 Q12,18 0,8 Z" />
          </svg>
        </div>

        <div class="berries-group">
          <div class="berry"></div>
          <div class="berry" style="transform: scale(0.85);"></div>
          <div class="berry"></div>
        </div>

        <div class="candle-stem">
          <div class="candle-wick"></div>
          <div class="flame-element" id="flame"></div>
          <div class="smoke-wisp" id="smoke"></div>
        </div>
      </div>
    </div>

    <div class="controls-container">
      <button class="wish-main-button" id="wish-button" type="button">
        🌬️ Thổi nến bằng micro
      </button>

      <button class="manual-tap-button" id="manual-blow-btn" type="button">
        🕯️ Hoặc bấm vào đây để tắt nến
      </button>

      <div class="gift-reveal-card" id="gift-reveal" hidden>
        <a class="gift-link-btn" href="gift.html">
          <span>🎁 Mở món quà bí mật dành cho cậu</span>
          <span aria-hidden="true">♡</span>
        </a>
      </div>

      <p class="wish-display-box" id="wish-message" role="status" aria-live="polite"></p>
    </div>

    <p class="footer">May your new age be filled with warmth & love ♡</p>
  </main>

  <script>
    (() => {
      'use strict';

      const button = document.getElementById('wish-button');
      const manualBtn = document.getElementById('manual-blow-btn');
      const flame = document.getElementById('flame');
      const smoke = document.getElementById('smoke');
      const candleGlow = document.getElementById('candle-glow');
      const message = document.getElementById('wish-message');
      const giftReveal = document.getElementById('gift-reveal');
      const canvas = document.getElementById('cake-canvas');

      /* -------------------------------------------------------------
       * 1. CELESTIAL BACKGROUND & FIREFLY PARTICLES
       * ------------------------------------------------------------*/
      let bCtx = null;
      let width = 0, height = 0;
      let cakeAnimId = null;
      const sparks = [];
      const floatingEmbers = [];

      if (canvas) {
        bCtx = canvas.getContext('2d');
        function resizeCanvas() {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Ambient floating golden embers
        for (let i = 0; i < 28; i++) {
          floatingEmbers.push({
            x: Math.random() * width,
            y: Math.random() * height,
            r: 1.2 + Math.random() * 2,
            speedY: 8 + Math.random() * 15,
            phase: Math.random() * Math.PI * 2
          });
        }

        let lastT = 0;
        function renderScene(t) {
          const delta = Math.min((t - lastT) / 1000, 0.05);
          lastT = t;
          const time = t / 1000;

          bCtx.clearRect(0, 0, width, height);

          // Draw floating embers
          floatingEmbers.forEach(e => {
            e.y -= e.speedY * delta;
            e.x += Math.sin(time * 1.5 + e.phase) * 10 * delta;
            if (e.y < -20) {
              e.y = height + 20;
              e.x = Math.random() * width;
            }

            const pulse = 0.35 + 0.65 * Math.pow(Math.sin(time * 2 + e.phase), 2);
            bCtx.fillStyle = `rgba(255, 215, 140, ${pulse * 0.7})`;
            bCtx.beginPath();
            bCtx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
            bCtx.fill();
          });

          // Draw celebration particle burst (when extinguished)
          for (let i = sparks.length - 1; i >= 0; i--) {
            const p = sparks[i];
            p.age += delta;
            if (p.age >= p.life) {
              sparks.splice(i, 1);
              continue;
            }
            p.x += p.vx * delta;
            p.y += p.vy * delta;
            p.vy += 30 * delta; // gentle gravity
            p.vx *= 0.98;

            const alpha = 1 - p.age / p.life;
            bCtx.globalAlpha = alpha;
            bCtx.fillStyle = p.color;
            bCtx.beginPath();
            bCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            bCtx.fill();
            bCtx.globalAlpha = 1;
          }

          cakeAnimId = requestAnimationFrame(renderScene);
        }
        cakeAnimId = requestAnimationFrame(renderScene);
      }

      function spawnCelebrationBurst() {
        const rect = flame.getBoundingClientRect();
        const originX = rect.left + rect.width / 2;
        const originY = rect.top + rect.height / 2;

        const colors = ['#ffe8af', '#ffd2de', '#f4a5c3', '#ffffff', '#e8b578'];
        for (let i = 0; i < 45; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 40 + Math.random() * 110;
          sparks.push({
            x: originX,
            y: originY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 35,
            r: 1.5 + Math.random() * 2.8,
            color: colors[Math.floor(Math.random() * colors.length)],
            age: 0,
            life: 1.2 + Math.random() * 0.8
          });
        }
      }

      /* -------------------------------------------------------------
       * 2. CRYSTAL CHIME SOUND (WEB AUDIO API)
       * ------------------------------------------------------------*/
      let chimeContext = null;
      function playChime(freq = 659.25) {
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          if (!chimeContext) chimeContext = new AudioContextClass();
          if (chimeContext.state === 'suspended') chimeContext.resume();

          const t = chimeContext.currentTime;
          const osc = chimeContext.createOscillator();
          const gain = chimeContext.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t);

          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.linearRampToValueAtTime(0.25, t + 0.006);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);

          osc.connect(gain);
          gain.connect(chimeContext.destination);

          osc.start(t);
          osc.stop(t + 1.8);
        } catch (e) {}
      }

      /* -------------------------------------------------------------
       * 3. EXTINGUISH & MICROPHONE BLOW DETECTION
       * ------------------------------------------------------------*/
      let audioContext = null;
      let microphoneStream = null;
      let analyser = null;
      let microphoneSource = null;
      let microphoneTimer = null;
      let isListening = false;
      let blowStartedAt = 0;

      function stopMicrophone() {
        isListening = false;
        clearInterval(microphoneTimer);
        microphoneTimer = null;

        if (microphoneStream) {
          microphoneStream.getTracks().forEach(track => track.stop());
          microphoneStream = null;
        }

        if (audioContext) {
          audioContext.close();
          audioContext = null;
        }

        analyser = null;
        microphoneSource = null;
        button.classList.remove('listening');
      }

      function extinguishCandle() {
        if (flame.classList.contains('out')) return;

        flame.classList.add('out');
        candleGlow.classList.add('dimmed');

        // Smoke animation
        smoke.classList.add('active');
        setTimeout(() => smoke.classList.remove('active'), 2500);

        // Particle burst & chime
        spawnCelebrationBurst();
        playChime(523.25);
        setTimeout(() => playChime(783.99), 120);

        // Show gift reveal & message
        giftReveal.hidden = false;
        message.textContent = 'Ước mong mọi điều ngọt ngào và dịu dàng nhất sẽ luôn mỉm cười bên cậu. Chúc mừng sinh nhật! ♡';
        button.textContent = '♡ Thắp nến lại';
        manualBtn.style.display = 'none';

        stopMicrophone();
      }

      function relightCandle() {
        flame.classList.remove('out');
        candleGlow.classList.remove('dimmed');
        message.textContent = '';
        giftReveal.hidden = true;
        button.textContent = '🌬️ Thổi nến bằng micro';
        manualBtn.style.display = 'inline-block';
        playChime(659.25);
      }

      async function startMicrophone() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          message.textContent = 'Trình duyệt chưa hỗ trợ micro. Cậu hãy bấm nút bên dưới để tắt nến nhé.';
          return;
        }

        try {
          button.disabled = true;
          button.textContent = '🎙️ Đang kết nối micro...';

          microphoneStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: false,
              autoGainControl: false
            }
          });

          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          await audioContext.resume();

          analyser = audioContext.createAnalyser();
          analyser.fftSize = 2048;
          analyser.smoothingTimeConstant = 0.15;

          microphoneSource = audioContext.createMediaStreamSource(microphoneStream);
          microphoneSource.connect(analyser);

          const samples = new Uint8Array(analyser.fftSize);
          let noiseLevel = 0;
          let calibrated = false;
          let loudFrames = 0;
          let listeningStartedAt = Date.now();
          blowStartedAt = 0;
          isListening = true;

          button.classList.add('listening');
          button.textContent = '🌬️ Hãy thổi mạnh vào micro!';
          message.textContent = 'Micro đã sẵn sàng. Hãy thổi vào micro trong khoảng 1 giây nhé...';

          microphoneTimer = setInterval(() => {
            if (!isListening || !analyser) return;

            analyser.getByteTimeDomainData(samples);
            let sum = 0;
            for (let i = 0; i < samples.length; i++) {
              const value = (samples[i] - 128) / 128;
              sum += value * value;
            }

            const volume = Math.sqrt(sum / samples.length);
            const elapsed = Date.now() - listeningStartedAt;

            if (!calibrated) {
              noiseLevel = volume;
              calibrated = true;
              return;
            }

            if (elapsed < 600) {
              noiseLevel = noiseLevel * 0.9 + volume * 0.1;
              return;
            }

            const threshold = Math.max(0.024, noiseLevel * 2.0);

            if (volume > threshold) {
              loudFrames++;
              if (!blowStartedAt) blowStartedAt = Date.now();

              if (Date.now() - blowStartedAt >= 600 && loudFrames >= 5) {
                extinguishCandle();
              }
            } else {
              loudFrames = 0;
              blowStartedAt = 0;
              noiseLevel = noiseLevel * 0.98 + volume * 0.02;
            }
          }, 50);

        } catch (error) {
          stopMicrophone();
          message.textContent = 'Cậu có thể dùng nút dự phòng bên dưới để tắt nến nhé.';
          button.textContent = '🌬️ Thử bật micro lại';
        } finally {
          button.disabled = false;
        }
      }

      button.addEventListener('click', async () => {
        if (flame.classList.contains('out')) {
          relightCandle();
          return;
        }

        if (isListening) {
          extinguishCandle();
          return;
        }

        await startMicrophone();
      });

      manualBtn.addEventListener('click', extinguishCandle);
      window.addEventListener('pagehide', stopMicrophone);

      document.addEventListener('page:before-exit', () => {
        stopMicrophone();
        if (cakeAnimId) cancelAnimationFrame(cakeAnimId);
        window.removeEventListener('resize', resizeCanvas);
      }, { once: true });
    })();
  </script>
  <script src="js/seamless.js"></script>
</body>
